<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Medical · Fernando Martinez</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0c0d11">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Medical">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            min-height: 100vh;
            padding: 24px;
            padding-top: env(safe-area-inset-top, 24px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(24px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.36);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid #4b5563;
            position: relative;
        }

        .menu-back {
            position: absolute;
            top: 0;
            left: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            background: #2d3748;
            border: 1px solid #4b5563;
            color: #d1d5db;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .menu-back:hover {
            color: #f3f4f6;
            border-color: #6b7280;
            transform: translateX(-2px);
        }

        h1 {
            color: #f9fafb;
            margin-bottom: 8px;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.022em;
        }

        .subtitle {
            color: #d1d5db;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 2px solid #374151;
            padding-bottom: 0;
        }

        .tab {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 24px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            position: relative;
            top: 2px;
        }

        .tab:hover { color: #d1d5db; }
        .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }

        .tab-content {
            display: none;
            flex: 1;
        }

        .tab-content.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 800px;
            border: none;
            border-radius: 12px;
            background: white;
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .container { padding: 24px; }
            .tabs { flex-direction: column; gap: 4px; }
            .tab { text-align: left; border-bottom: none; border-left: 3px solid transparent; }
            .tab.active { border-left-color: #3b82f6; border-bottom-color: transparent; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="menu-back">← Home</a>
            <h1>🏥 Medical Dashboard</h1>
            <p class="subtitle">Provider dashboards updated weekly</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('oncologist')">Oncologist</button>
            <button class="tab" onclick="switchTab('nutritionist')">Nutritionist</button>
        </div>

        <div id="oncologist-tab" class="tab-content active">
            <iframe src="health/medical/martinez_oncologist_dashboard.html"></iframe>
        </div>

        <div id="nutritionist-tab" class="tab-content">
            <iframe src="health/medical/martinez_nutritionist_dashboard.html"></iframe>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
